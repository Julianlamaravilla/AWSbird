<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Kiro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #2c3e50;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #gameCanvas {
      display: block;
      background-color: #87CEEB;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #87CEEB;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
    }

    #loadingScreen.hidden {
      display: none;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #errorScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #87CEEB;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
      text-align: center;
    }

    #errorScreen.visible {
      display: flex;
    }

    #errorScreen h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ff6b6b;
    }

    #errorScreen p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    #errorScreen button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #errorScreen button:hover {
      background-color: #45a049;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-G03ND_zF.js"></script>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="loadingScreen">
      <div class="spinner"></div>
      <p>Loading Flappy Kiro...</p>
    </div>

    <div id="errorScreen">
      <h2>Error Loading Game</h2>
      <p id="errorMessage">Failed to load game assets. Please check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </div>

</body>
</html>
